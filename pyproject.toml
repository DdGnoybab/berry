[project]
name = "berry"
version = "0.1.0"
description = "Berry — 飞书原生个人工作台 / 编码 Agent 后端"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "bbb" }]

dependencies = [
    # ─── 持久化 ───
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",                # 异步 driver(应用代码用)
    "psycopg[binary]>=3.2",         # 同步 driver(alembic 用)
    "alembic>=1.13",
    # ─── Web 框架 ───
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # ─── 配置 / 校验 ───
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # ─── 日志 ───
    "structlog>=24.4",
    # ─── LLM Gateway(Batch 1)───
    "openai>=1.50",
    "pyyaml>=6.0",
    "watchfiles>=0.24",
    # ─── 后续按需要打开 ───
    # 飞书(接入飞书时打开)
    # "lark-oapi>=1.4",
    # Anthropic 协议(Batch 2 打开)
    # "anthropic>=0.40",
    # Agent 编排(接 LangGraph 时打开)
    # "langgraph>=0.2",
    # "langgraph-checkpoint-postgres>=2.0",
    # 调度
    # "apscheduler>=3.10",
    # HTTP / 安全(用到再开)
    # "httpx>=0.27",
    # "cryptography>=43",
    "sqlalchemy[asyncio]>=2.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
]
rag = [
    # Personal RAG service 才需要
    "sqlite-vec>=0.1",
]
docker-sandbox = [
    # V1 Docker per workspace 才需要
    "docker>=7.0",
]
redis = [
    # V1 起接入
    "redis>=5.0",
]

[project.scripts]
berry = "berry.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["berry"]

# ─── 代码风格 ───────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/fixtures/"]

# ─── 测试 ──────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["berry"]
branch = true

# ─── ⭐ Import-Linter:Modular Monolith 依赖方向硬规则 ───
# 对应 CLAUDE.md「⭐ 架构设计语言 §2 五条硬规则」
# 跑法:uv run lint-imports
# CI:violation 直接 fail

[tool.importlinter]
root_packages = ["berry"]
include_external_packages = false

# ── Three-layer main direction ──

# Rule 1: core does not depend on channels
[[tool.importlinter.contracts]]
name = "core does not depend on channels"
type = "forbidden"
source_modules = ["berry.core"]
forbidden_modules = ["berry.channels"]

# Rule 2: core does not depend on gateway
[[tool.importlinter.contracts]]
name = "core does not depend on gateway"
type = "forbidden"
source_modules = ["berry.core"]
forbidden_modules = ["berry.gateway"]

# Rule 3a: channels does not depend on gateway (siblings)
[[tool.importlinter.contracts]]
name = "channels does not depend on gateway"
type = "forbidden"
source_modules = ["berry.channels"]
forbidden_modules = ["berry.gateway"]

# Rule 3b: gateway does not depend on channels (siblings)
[[tool.importlinter.contracts]]
name = "gateway does not depend on channels"
type = "forbidden"
source_modules = ["berry.gateway"]
forbidden_modules = ["berry.channels"]

# ── core internal refinements ──

# Rule 5: core.tools does not depend on core.agent (tools are leaves)
[[tool.importlinter.contracts]]
name = "core.tools does not depend on core.agent"
type = "forbidden"
source_modules = ["berry.core.tools"]
forbidden_modules = ["berry.core.agent"]

# Rule 6: core.db does not depend on any business module
[[tool.importlinter.contracts]]
name = "core.db does not depend on business modules"
type = "forbidden"
source_modules = ["berry.core.db"]
forbidden_modules = [
    "berry.core.agent",
    "berry.core.tools",
    "berry.core.skills",
    "berry.core.sandbox",
    "berry.core.rag",
    "berry.channels",
    "berry.gateway",
]

# ── Top-level base ──

# Rule 7: domain does not import any berry internal module
[[tool.importlinter.contracts]]
name = "domain does not import any berry module"
type = "forbidden"
source_modules = ["berry.domain"]
forbidden_modules = [
    "berry.channels",
    "berry.gateway",
    "berry.core",
    "berry.observability",
    "berry.security",
    "berry.entrypoints",
]
