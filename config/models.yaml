# Berry LLM 模型 catalog
#
# 安全规则:
# - api_key 必须用 ${VAR} 形式,从 .env 读
# - 明文 api_key 会被解析层拒绝
# - 此文件入 git,真实凭证在 .env 不入 git

version: 1

models:
  # ─── DeepSeek(OpenAI ChatCompletions 兼容)───
  - id: deepseek-chat
    kind: text
    api: openai-completions
    provider: deepseek
    base_url: https://api.deepseek.com/v1
    model_name: deepseek-chat
    api_key: ${DEEPSEEK_KEY}
    timeout_s: 60
    capabilities: [tool_use]
    defaults:
      temperature: 0.7

  # ─── DeepSeek 通过 /anthropic 端点暴露 Anthropic 兼容协议 ───
  # 同一个 key,不同 base_url + 不同 api 字段 = 不同协议
  # 注意:DeepSeek 的 /anthropic 端点 IGNORE cache_control 标记,
  # 想验证 prompt cache 必须切到 anthropic-claude(下面那条)。
  - id: deepseek-anthropic
    kind: text
    api: anthropic-messages
    provider: deepseek
    base_url: https://api.deepseek.com/anthropic
    model_name: deepseek-chat
    api_key: ${DEEPSEEK_KEY}
    timeout_s: 60
    capabilities: [tool_use]
    defaults:
      # 8192 给 LLM 写完整 .md 内容 + tool_use input JSON 的余地。
      # 1024 太小:LLM 调 write_md 写一篇内容稍长的文章会被截断,
      # ToolCallDelta 的 partial_json 还没写完就 stop_reason=max_tokens,
      # 导致 StreamAccumulator 解析半截 JSON 失败。
      max_tokens: 8192

  # ─── Anthropic 官方端点(支持 prompt cache)───
  # 把 aliases.main 切到这里就能用 cache_control: ephemeral。
  # 模型名以 Anthropic 实际公开的 ID 为准(如 claude-opus-4-5-20251111 等),
  # 切之前去 https://docs.anthropic.com/en/docs/about-claude/models 核对当前可用 id。
  - id: anthropic-claude
    kind: text
    api: anthropic-messages
    provider: anthropic
    base_url: https://api.anthropic.com
    model_name: claude-sonnet-4-5
    api_key: ${ANTHROPIC_API_KEY}
    timeout_s: 120
    capabilities: [tool_use, prompt_cache]
    defaults:
      max_tokens: 8192

# 别名:让业务代码用业务名,不写死具体 model_id
aliases:
  classify: deepseek-chat
  # 默认走 DeepSeek 的 /anthropic 端点(便宜、Anthropic 协议)。
  # prompt cache 不在这条路径上工作:DeepSeek /anthropic 端点 ignore cache_control,
  # 也不返回 cache_read_input_tokens / cache_creation_input_tokens 字段。
  # 等切到 anthropic-claude(真 Anthropic key + 端点)时 cache 才会生效。
  main: deepseek-anthropic

# Fallback 链(MVP 解析但不生效,V1 实装)
fallback: {}
