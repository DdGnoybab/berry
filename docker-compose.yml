# Berry 部署编排。
#
# 起停:
#   docker compose up -d              # 启动 berry + postgres + web(默认)
#   docker compose --profile redis up -d   # 加上 redis
#   docker compose down               # 停(数据卷保留)
#   docker compose logs -f berry      # 看日志
#
# 第一次部署:
#   1. cp deploy/env.production.example .env.production && 改里面的 key
#   2. docker compose up -d --build
#   3. docker compose exec berry alembic upgrade head    # 跑迁移

services:
  postgres:
    image: postgres:16-alpine
    container_name: berry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: berry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: berry
    volumes:
      - berry_pgdata:/var/lib/postgresql/data
    # 不暴露端口到宿主公网,只 compose 内网可见
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berry -d berry"]
      interval: 5s
      timeout: 5s
      retries: 10

  berry:
    build:
      context: .
      dockerfile: Dockerfile
    image: berry:latest
    container_name: berry-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # 覆盖 .env.production 里的 DATABASE_URL,确保指向 compose 内的 postgres
      DATABASE_URL: postgresql://berry:${POSTGRES_PASSWORD}@postgres:5432/berry
      LOG_FORMAT: json
      BERRY_DEV: "0"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 持久化 berry 自家数据(笔记 / projects / sessions)
      - berry_data:/app/data
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    image: berry-web:latest
    container_name: berry-web
    restart: unless-stopped
    depends_on:
      - berry
    ports:
      # 唯一暴露到公网的端口
      - "80:80"

  redis:
    # 默认不启;`docker compose --profile redis up -d` 才拉起来
    profiles: ["redis"]
    image: redis:7-alpine
    container_name: berry-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - berry_redisdata:/data
    expose:
      - "6379"

  # ─── 监控栈 ───────────────────────────────────────────
  # spec: docs/superpowers/specs/2026-06-15-monitoring-design.md
  # 暴露到公网的只有 grafana(经 nginx /grafana/ 反代),
  # prometheus / node-exporter / cadvisor 都只 compose 内部可见。

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: berry-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - berry_prom_data:/prometheus
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:11.5.0
    container_name: berry-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set}
      # 子路径部署:Grafana 会被 nginx 反代到 /grafana/
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - berry_grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    expose:
      - "3000"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: berry-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: berry-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"

volumes:
  berry_pgdata:
  berry_data:
  berry_redisdata:
  berry_prom_data:        # prometheus 时序数据(7 天 retention)
  berry_grafana_data:     # grafana 自身数据(用户/dashboard 持久化)
