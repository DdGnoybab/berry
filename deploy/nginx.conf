# Berry web 入口反代配置。
#
# 浏览器只跟 nginx 说话(:80),不直接访问 berry:8000 —— 跨域消失,
# 后端不暴露公网。
#
# 关键点:
# - / 走静态(SPA),fallback index.html 让前端路由生效
# - /v1/* 透传到 berry,**SSE 必须关 buffering**,否则流式回复卡住
# - X-Forwarded-* 透传真实客户端 IP / scheme,后端日志能看见

upstream berry_backend {
    server berry:8000;
}

server {
    listen 80;
    server_name _;

    # 静态资源(Vite 构建产物)
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback:前端路由不存在的路径回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 RPC + SSE
    location /v1/ {
        proxy_pass http://berry_backend;
        proxy_http_version 1.1;

        # 透传客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式:关掉 buffering,否则事件会被攒着不发
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # LLM 调用可能跑很久,默认 60s 不够
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 认证路由 — /auth/login, /auth/logout, /auth/me。
    # 不走 SSE,普通 RPC 即可,但 cookie 必须正确透传。
    location /auth/ {
        proxy_pass http://berry_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gzip 静态资源
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 健康检查
    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
