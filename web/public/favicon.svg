<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ZZZ style: black bg, yellow accent, cut corner -->
  <path d="M0 0 L28 0 L32 4 L32 32 L4 32 L0 28 Z" fill="#0A0A0A" stroke="#FFE600" stroke-width="1.5"/>
  <!-- Inner yellow cut corner detail -->
  <path d="M2 2 L26 2 L30 6" fill="none" stroke="#FFE600" stroke-width="1" opacity="0.4"/>
  <!-- B letter - Impact style, bold -->
  <text x="16" y="23" text-anchor="middle" font-size="20" fill="#FFE600" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" letter-spacing="-0.5">B</text>
  <!-- Small accent dots -->
  <rect x="4" y="4" width="2" height="2" fill="#FFE600" opacity="0.6"/>
</svg>