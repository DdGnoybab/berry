# alembic 主配置。
# DB URL 不写在这里,而是在 alembic/env.py 里从 berry.config.settings 读 —— 单一真相源。
# 这样 .env 改了 alembic 也跟着变。

[alembic]
script_location = alembic

# 迁移文件命名:0001_xxx / 0002_xxx 这样,便于 git 排序
file_template = %%(rev)s_%%(slug)s

# 时区:迁移文件里的时间戳用 UTC
timezone = UTC

# Python 路径:让 env.py 能 import berry.*
prepend_sys_path = .

# 不加日期前缀(rev id 自带)
truncate_slug_length = 40

# 写入 alembic_version 表的策略
version_path_separator = os

# 输出格式
[post_write_hooks]
# 留空:自动生成的迁移文件不跑额外格式化
# 以后想要 ruff 自动格式化可以加:
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

# ─── Logging(alembic 内部日志) ───
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
